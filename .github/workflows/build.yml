name: Build GraalVM Native Image and Deploy to AWS Lambda

on:
  push:
    branches: [main,master]


env:
  AWS_REGION: ap-south-1  # Mumbai region (Apne hisab se change karein)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # GraalVM build time leta hai, isliye timeout badhaya

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Authenticate Docker with Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build Native Docker Image & Push to ECR
      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      # Step 5: Update AWS Lambda Function Code
      # Step 5: Update AWS Lambda (Sirf tab chalega jab secret present ho)
      - name: Deploy Image to AWS Lambda
        if: ${{ secrets.LAMBDA_FUNCTION_NAME != '' }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --image-uri $IMAGE_URI

      # Step 6: Wait for Update (Sirf tab chalega jab secret present ho)
      - name: Wait for Lambda Update
        if: ${{ secrets.LAMBDA_FUNCTION_NAME != '' }}
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}