spring:
  application:
    name: quickcommerce
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minutemart}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

identity:
  auth:
    delivery-mode: ${IDENTITY_DELIVERY_MODE:development}
    expose-development-secrets: ${IDENTITY_EXPOSE_DEVELOPMENT_SECRETS:false}
    otp-validity: 5m
    otp-resend-cooldown: 30s
    otp-max-attempts: 5
    access-token-validity: 15m
    refresh-token-validity: 30d
    invitation-validity: 2d
    bootstrap-admin-phone: ${IDENTITY_BOOTSTRAP_ADMIN_PHONE:+919999999999}
    bootstrap-admin-password: ${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:Admin@MinuteMart2026}

